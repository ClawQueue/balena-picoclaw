global
    log stdout format raw local0 warning
    # Tuned for low-memory SBCs (Raspberry Pi Zero / BeagleBone Black)
    maxconn 64

defaults
    log     global
    mode    http
    option  dontlognull
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  3600s

frontend http_in
    bind 0.0.0.0:80

    # Detect if request arrives via Balena public URL tunnel
    acl is_balena_public hdr_end(Host) -i balena-devices.com

    # Detect direct gateway endpoints (webhooks, health/readiness probes)
    acl is_gateway_direct path_beg /webhook/ /health /ready

    # For balena public URL: serve the web UI directly (Balena proxies HTTPS→HTTP to port 80)
    # For LAN access: redirect to HTTPS
    http-request redirect scheme https code 301 unless is_balena_public

    # Forward standard proxy headers so PicoClaw Launcher & WebSocket URLs
    # accurately recognize HTTPS scheme, port, and client origin
    http-request set-header X-Forwarded-Proto https if is_balena_public
    http-request set-header X-Forwarded-Port 443 if is_balena_public
    http-request set-header X-Forwarded-Host %[req.hdr(Host)] if is_balena_public
    http-request set-header X-Forwarded-For %[src] if is_balena_public
    http-request set-header X-Real-IP %[src] if is_balena_public

    use_backend picoclaw_gateway if is_gateway_direct
    default_backend picoclaw_webui

frontend https_in
    bind 0.0.0.0:443 ssl crt /etc/haproxy/certs/self-signed.pem
    bind 0.0.0.0:8443 ssl crt /etc/haproxy/certs/self-signed.pem

    acl is_gateway_direct path_beg /webhook/ /health /ready

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]

    use_backend picoclaw_gateway if is_gateway_direct
    default_backend picoclaw_webui

backend picoclaw_webui
    # Primary: PicoClaw WebUI Launcher (port 18800, manages gateway & proxies /pico/ws)
    # Backup:  PicoClaw Headless Gateway (port 18790, active when PICOCLAW_MODE=gateway)
    server launcher 127.0.0.1:18800 check inter 5s fall 2 rise 1
    server gateway  127.0.0.1:18790 check backup inter 5s fall 2 rise 1

backend picoclaw_gateway
    server gateway 127.0.0.1:18790 check inter 5s fall 2 rise 1
